[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventor_to_radan"
version = "1.0.0"
description = "Convert an Inventor BOM export into a Radan import CSV"
requires-python = ">=3.10"
dependencies = [
    # tkinter is stdlib; pandas and PySide6 were removed to keep the frozen
    # exe small (they were 70 MB of it) - see README "Option C".
    "openpyxl",
]

[project.scripts]
inventor-to-radan = "inventor_to_radan.cli:main"

[tool.setuptools]
packages = ["inventor_to_radan", "inventor_to_radan.dialogs"]
package-dir = { "inventor_to_radan" = "." }

[tool.setuptools.package-data]
inventor_to_radan = [
    "description_rules.csv",
    "ftq_parts.csv",
    "nonlaser_tokens.csv",
    "stock_cut_parts.csv",
]

[tool.pytest.ini_options]
# Only our tests. Without this, a run started right after build_verify_exe.bat
# collects .buildvenv's site-packages and reports scores of errors that have
# nothing to do with this app.
testpaths = ["tests"]
